name: Test and deploy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        base: ["/", "/korovany/"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - run: npm ci
      - run: make check
      - name: Build release
        env:
          BASE_PATH: ${{ matrix.base }}
        run: |
          npm run build -- --base="$BASE_PATH"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/ZetoOfficial/korovany/internal/server.BuildRevision=$GITHUB_SHA" -o bin/korovany ./cmd/korovany
      - run: npx playwright install --with-deps chromium
      - name: Browser regressions
        env:
          BASE_PATH: ${{ matrix.base }}
        run: |
          ./bin/korovany -base-path "$BASE_PATH" > /tmp/korovany.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/korovany.log' EXIT
          export ASTRA_URL="http://127.0.0.1:8080$BASE_PATH"
          curl --retry 20 --retry-connrefused --retry-delay 1 --retry-max-time 30 -fsS "${ASTRA_URL}api/health"
          npm run test:campaign
          npm run test:multiplayer
          npm run test:latency
      - name: Package tested release
        if: matrix.base == '/korovany/'
        run: tar -czf korovany-linux-amd64.tar.gz bin/korovany dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.base == '/korovany/'
        with:
          name: korovany-linux-amd64
          path: korovany-linux-amd64.tar.gz
          retention-days: 14

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://zetoqqq.ru/korovany/
    concurrency:
      group: korovany-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: korovany-linux-amd64
      - name: Skip superseded commits
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit is already on master; skipping this deployment.'
          fi
      - name: Deploy tested artifact
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/korovany
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/korovany' EXIT
          ssh -T -i ~/.ssh/korovany -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 korovany-deploy@62.84.101.20 "deploy $GITHUB_SHA" < korovany-linux-amd64.tar.gz
      - name: Verify public HTTPS route
        if: steps.latest.outputs.deploy == 'true'
        run: |
          curl --retry 5 --retry-delay 2 --fail --silent --show-error --max-time 15 https://zetoqqq.ru/korovany/api/health > health.json
          python3 -c 'import json,os; data=json.load(open("health.json")); assert data["status"] == "ok" and data["revision"] == os.environ["GITHUB_SHA"], data'
          curl --fail --silent --show-error --max-time 15 https://zetoqqq.ru/korovany/arena/ > /dev/null
